# 「机」到病除 —— nginx 站点配置
#
# 装到 /etc/nginx/sites-available/yaodao 并软链到 sites-enabled/，
# 或者直接放 /etc/nginx/conf.d/yaodao.conf（两者选一，别都放）。
#
#     sudo cp deploy/nginx.conf /etc/nginx/sites-available/yaodao
#     sudo ln -sf /etc/nginx/sites-available/yaodao /etc/nginx/sites-enabled/yaodao
#     sudo nginx -t && sudo systemctl reload nginx
#
# 前端 dist 与后端 uploads 都在 /srv/yaodao 下 —— 与部署手册里的目录约定一致。

server {
    # 香港节点（本方案默认）不备案也能正常监听 80，这行不用改。
    #
    # ⚠️ 只有**大陆节点 + 未备案域名**才会被云厂商拦 80/443。那种情况下把这两行
    # 改成 8080，访问地址随之变成 http://<IP>:8080/。（更推荐的做法是干脆用
    # 香港节点免掉备案，见部署手册第 0 节。）
    listen 80;
    listen [::]:80;

    # 没有域名就留 _；买好域名后改成 server_name <域名> www.<域名>;
    # certbot 申请证书时会靠这行认域名，脚本里已说明怎么改（见附录前那一节）。
    server_name _;

    # ⚠️ 必须与后端 config.py 的 MAX_UPLOAD_BYTES 对齐（10MB）。
    # nginx 这一层先拦掉超大请求，省得把 10MB 垃圾传到 Python 再被拒。
    # 改后端上限时**这里也要改**，否则会出现"nginx 放过了、后端 413"的割裂表现。
    client_max_body_size 10m;

    # 前端构建产物
    root /srv/yaodao/dist;
    index index.html;

    # gzip：前端是 React + ECharts，JS 包不小，压缩收益明显
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── 前端 SPA ──
    # 前端用 react-router，/monitor /identify 这些路径在磁盘上**没有对应文件**，
    # 必须回退到 index.html 交给前端路由自己处理。少了 try_files 这一行，
    # 访客直接访问或刷新子页面就是 404 —— 而且首页一切正常，只在刷新时才复现。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 产出的资源文件名带内容哈希，内容变了名字就变 —— 可以放心长缓存。
    # 这是前端唯一值得设长缓存的地方，别把 index.html 也加进来：
    # index.html 引用的是哈希文件名，它自己被缓存住的话，部署完访客会
    # 拿着旧 index.html 去请求已经删掉的旧哈希文件，页面直接白屏。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── 后端 API ──
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # ⚠️⚠️ 这一行是整份配置里最关键的，务必用 $remote_addr **覆盖**。
        #
        # 后端的按 IP 限流（services/guard.py::client_ip）优先读 X-Forwarded-For。
        # 反代之后，后端看到的 request.client.host 是 nginx 自己的地址
        # （127.0.0.1），**对所有访客都一样** —— 要是没有这个头，限流会按
        # "一个人"计数，第 15 个请求开始全部访客一起被拒，而且现象是
        # "用着用着就 429 了"，极难联想到是取错了 IP。
        #
        # 为什么不用 nginx 默认推荐的 $proxy_add_x_forwarded_for：
        # 那个变量的语义是"把访客自带的 XFF 头原样接在前面"，即
        #     $http_x_forwarded_for, $remote_addr
        # 访客只要自己发一个 X-Forwarded-For: 1.2.3.4，就能让后端读到 1.2.3.4，
        # 每次换一个假 IP —— **限流键可伪造 = 限流形同虚设**。
        # 我们前面没有别的代理，直接覆盖成真实对端地址即可。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        # 推理是 CPU 密集的：实测单张 300–500ms，大图可到 1s+。
        # 默认 60s 够用，但并发排队时（见 config.INFER_CONCURRENCY）要留余量。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 上传是 multipart，别让 nginx 缓冲到磁盘再转发 —— 直接流给后端
        proxy_request_buffering off;
    }

    # ── 上传的图片 ──
    # 直接由 nginx 从磁盘发，不经过 Python：静态文件是 nginx 的主场，
    # 而且这样标注图不计入推理并发闸门。
    #
    # ⚠️ 注意这里**没有** try_files 回退到 index.html —— 找不到了就该是 404。
    # 过期清理（services/cleanup.py）会把超过保留期的图删掉并把记录里的 URL
    # 置 NULL，此时若回退到 index.html，浏览器会拿到一个 HTML 当图片解析，
    # 表现成"图片裂了"而不是干净的 404，反而更难查。
    location /uploads/ {
        alias /srv/yaodao/server/static/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        # 图片目录不该被列目录
        autoindex off;
        try_files $uri =404;
    }

    # 后端探活，方便从外部确认服务状态（不暴露其他内部信息）
    location = /api/health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }
}
