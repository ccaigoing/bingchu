<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>检测链路验证 · 「机」到病除</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.6 system-ui, "Microsoft YaHei", sans-serif; margin: 0; padding: 32px;
         max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #777; margin-bottom: 24px; font-size: 13px; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button { padding: 8px 18px; border-radius: 8px; border: 1px solid #ccc; background: #1a7f37;
           color: #fff; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .banner { margin: 16px 0; padding: 12px 16px; border-radius: 8px; font-size: 14px; }
  .banner.err { background: #fdecec; border: 1px solid #d03b3b; color: #8a1f1f; }
  .banner.warn { background: #fff6e5; border: 1px solid #fab219; color: #7a5200; }
  .banner.ok { background: #e9f7ec; border: 1px solid #0ca30c; color: #10541a; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 20px; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
  img { max-width: 100%; border-radius: 8px; border: 1px solid #ddd; display: block; }
  .cap { font-size: 12px; color: #777; margin: 6px 0 0; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; margin: 0; }
  .kv dt { color: #666; }
  .kv dd { margin: 0; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 12px; }
  th, td { border: 1px solid #e2e2e2; padding: 6px 10px; text-align: left; }
  th { background: #f6f6f6; font-weight: 600; }
  pre { background: #f6f6f6; padding: 12px; border-radius: 8px; overflow: auto; font-size: 12px;
        max-height: 300px; }
  .lv-critical { color: #d03b3b; font-weight: 700; }
  .lv-serious  { color: #ec835a; font-weight: 700; }
  .lv-warning  { color: #b8860b; font-weight: 700; }
  .lv-good     { color: #0ca30c; font-weight: 700; }
  .hide { display: none; }
</style>
</head>
<body>

<h1>检测链路验证</h1>
<p class="sub">上传一张真实作物照片，确认后端真的画出框 —— 这是阶段一的验收动作。</p>

<div class="bar">
  <input type="file" id="file" accept="image/*">
  <button id="go" disabled>上传并检测</button>
  <span id="hint" class="sub" style="margin:0"></span>
</div>

<div id="banner" class="banner ok hide"></div>

<div id="result" class="cols hide">
  <div>
    <img id="annotated" alt="标注结果">
    <p class="cap">后端返回的标注图（框是服务端画进去的，不是前端叠的）</p>
  </div>
  <div>
    <dl class="kv" id="kv"></dl>
    <table id="tbl">
      <thead><tr><th>类别</th><th>类别码</th><th>框贴合度</th><th>区域</th><th>面积占比</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<details id="rawwrap" class="hide" style="margin-top:24px">
  <summary style="cursor:pointer">原始响应 JSON</summary>
  <pre id="raw"></pre>
</details>

<script>
const $ = s => document.querySelector(s);
const API = 'http://127.0.0.1:8000';
let picked = null;

$('#file').addEventListener('change', e => {
  picked = e.target.files[0] || null;
  $('#go').disabled = !picked;
  $('#hint').textContent = picked ? `${picked.name} · ${(picked.size/1024).toFixed(0)} KB` : '';
});

$('#go').addEventListener('click', async () => {
  if (!picked) return;
  $('#go').disabled = true;
  $('#go').textContent = '检测中…';
  $('#banner').className = 'banner ok hide';

  const fd = new FormData();
  fd.append('file', picked);

  try {
    const t0 = performance.now();
    const res = await fetch(`${API}/api/detect`, { method: 'POST', body: fd });
    const rtt = Math.round(performance.now() - t0);
    const data = await res.json();

    if (!res.ok) {
      const d = data.detail || {};
      throw new Error(d.error || data.error || `HTTP ${res.status}`);
    }

    render(data, rtt);
  } catch (err) {
    showBanner('err', `请求失败：${err.message}　—— 后端起来了吗？（uvicorn 应在 127.0.0.1:8000）`);
  } finally {
    $('#go').disabled = false;
    $('#go').textContent = '上传并检测';
  }
});

function showBanner(kind, text) {
  const b = $('#banner');
  b.className = `banner ${kind}`;
  b.textContent = text;
}

function render(d, rtt) {
  const m = d.model, s = d.summary;

  if (m.mode !== 'normal') {
    showBanner('warn', `⚠ 模型处于降级模式（${m.error || '未知原因'}）—— 返回的框不可信，请检查权重文件。`);
  } else if (d.detections.length === 0) {
    showBanner('warn', '模型正常，但这张图没有检出任何目标。换一张病斑更明显的照片试试。');
  } else {
    showBanner('ok',
      `✓ 检出 ${d.detections.length} 个目标（病害 ${s.counts.disease} · 虫害 ${s.counts.pest}` +
      `${s.counts.other ? ' · 未映射 ' + s.counts.other : ''}）` +
      `　模型 ${m.name} · ${m.device} · 推理 ${d.latencyMs}ms · 往返 ${rtt}ms`);
  }

  $('#annotated').src = API + d.image.annotatedUrl;

  $('#kv').innerHTML = `
    <dt>主要类别</dt><dd>${s.topClassName ?? '—'} <span style="color:#888;font-weight:400">(${s.topClassCode ?? '—'})</span></dd>
    <dt>置信度</dt><dd>${(s.confidence * 100).toFixed(1)}%</dd>
    <dt>严重度</dt><dd class="lv-${s.severityLevel}">${s.severityLabel}</dd>
    <dt>感染面积</dt><dd>${(s.infectedAreaRatio * 100).toFixed(1)}%</dd>
    <dt>病灶数</dt><dd>${s.spotCount}</dd>
    <dt>位置描述</dt><dd>${s.regionDesc}</dd>
    <dt>建议措施</dt><dd style="font-weight:400">${s.advice}</dd>
    <dt>图像尺寸</dt><dd style="font-weight:400">${d.image.width} × ${d.image.height}</dd>`;

  $('#tbl tbody').innerHTML = d.detections.map(x => `
    <tr>
      <td>${x.nameCn}</td>
      <td style="color:#888">${x.code}</td>
      <td>${(x.localizationScore * 100).toFixed(1)}%</td>
      <td>${({top:'上方',mid:'中部',bottom:'下方'})[x.region] || x.region}</td>
      <td>${(x.areaRatio * 100).toFixed(1)}%</td>
    </tr>`).join('') || '<tr><td colspan="5" style="color:#888">无检出</td></tr>';

  $('#raw').textContent = JSON.stringify(d, null, 2);
  $('#result').classList.remove('hide');
  $('#rawwrap').classList.remove('hide');
}

// 启动时探一次健康状态，模型没就绪能立刻看出来
(async () => {
  try {
    const h = await (await fetch(`${API}/api/health`)).json();
    if (h.model.mode !== 'normal') {
      showBanner('warn', `后端已启动，但模型降级：${h.model.error || '未知原因'}`);
    } else {
      showBanner('ok', `后端就绪 · 模型 ${h.model.name} · ${h.model.device} · ${h.model.classCount} 类`);
    }
  } catch {
    showBanner('err', '连不上后端 127.0.0.1:8000 —— 请先启动 uvicorn。');
  }
})();
</script>
</body>
</html>
